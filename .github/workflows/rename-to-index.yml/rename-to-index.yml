name: Rename to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git mv sample37-claude.html index.html
          git config user.name "LiuSiyuan261"
          git config user.email "liusiyuan261@gmail.com"
          git commit -m "Rename sample37-claude.html to index.html"
          git push
